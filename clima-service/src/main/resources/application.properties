spring.application.name=clima-service
server.port=8083

# Open-Meteo (pronóstico). Timeouts de 5 s en conexión y lectura (ver RestClientConfig).
open-meteo.url=${OPEN_METEO_URL:https://api.open-meteo.com}
open-meteo.timeout-ms=5000

# Resource server JWT: sólo valida la firma con las claves de Keycloak (sin validar issuer).
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWK_URI:http://localhost:8180/realms/parapente/protocol/openid-connect/certs}

# Sólo /actuator/health expuesto.
management.endpoints.web.exposure.include=health

springdoc.api-docs.path=/api/v1/clima/v3/api-docs
springdoc.swagger-ui.enabled=false
