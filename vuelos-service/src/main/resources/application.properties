# Servicio de Vuelos (puerto 8082). Todo configurable por variables de entorno con valor local por defecto.
spring.application.name=vuelos-service
server.port=8082

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/vuelos_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# El esquema lo maneja Flyway; Hibernate sólo lo valida.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# Resource server JWT (Keycloak), sin validar issuer.
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWK_URI:http://localhost:8180/realms/parapente/protocol/openid-connect/certs}

# URLs de los otros servicios
servicios.pilotos.url=${PILOTOS_URL:http://localhost:8081}
servicios.clima.url=${CLIMA_URL:http://localhost:8083}

# Sólo /actuator/health expuesto
management.endpoints.web.exposure.include=health

springdoc.api-docs.path=/api/v1/vuelos/v3/api-docs
springdoc.swagger-ui.path=/api/v1/vuelos/swagger-ui.html
