spring.application.name=pilotos-service
server.port=8081

# Base propia del servicio (variables de entorno con valor por defecto para correr local)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/pilotos_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
# El esquema lo maneja Flyway; Hibernate sólo valida que coincida con las entidades
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Resource server: valida firma con las claves públicas de Keycloak (sin validar issuer)
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWK_URI:http://localhost:8180/realms/parapente/protocol/openid-connect/certs}

# Sólo /actuator/health expuesto
management.endpoints.web.exposure.include=health
springdoc.api-docs.path=/api/v1/pilotos/v3/api-docs
